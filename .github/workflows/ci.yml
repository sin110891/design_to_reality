name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t dtr .

      - name: Run both test suites (fake providers, no secrets)
        run: docker run --rm dtr
