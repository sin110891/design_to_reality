[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-dataset"
version = "0.1.0"
description = "Hybrid rulebook + multimodal model dataset builder for interior design curation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Design to Reality" }]
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
  "pillow>=11.0.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.5",
  "pyarrow>=18.0.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]

[project.scripts]
design-data = "design_dataset.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
design_dataset = ["prompts/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["design_dataset"]
