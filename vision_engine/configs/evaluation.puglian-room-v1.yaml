cases:
  - room_image_path: /Users/sinandjevdet/Downloads/lounge_kitchen_1_belgrave.jpeg
    brief: "Create a calm, refined Puglian interior that feels evolved from an old building rather than newly decorated. Preserve the existing architectural shell and patina, then introduce only a few precise contemporary interventions. Aim for an airy, tactile atmosphere with muted mineral colour, natural light and restrained Italian furniture. Avoid generic luxury, glossy finishes, visual clutter and theme-like rustic styling. Prefer low intervention and buildable details without changing openings or fixed geometry."
