[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-engine"
version = "0.1.0"
description = "Local-first curated retrieval + room redesign concept prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Design to Reality" }]
dependencies = [
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "sqlalchemy>=2.0.36",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
  "pillow>=11.0.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "numpy>=2.0.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.1",
  "google-genai>=1.0.0",
  "gradio>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]

[project.scripts]
vision-engine = "vision_engine.cli:app"
concept-board = "vision_engine.concept_board.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_engine = ["prompts/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["vision_engine"]
